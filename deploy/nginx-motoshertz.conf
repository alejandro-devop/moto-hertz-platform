# motoshertz.com — reverse proxy hacia los 3 procesos de PM2. TLS: Origin CA
# de Cloudflare (motoshertz.com pasa por Cloudflare con proxy activo, modo
# Full strict — no certbot, a diferencia de motoshotwheels.com). Ver
# docs/architecture/deployment.md.
#
# Nota: el droplet ya expone 137.184.225.127 vía el DNS sin proxy de
# motoshotwheels.com, así que "ocultar el origen" detrás de Cloudflare no es
# protección real acá — es solo caché/WAF, no un secreto de IP.
#
# Instalar: copiar a /etc/nginx/sites-available/motoshertz.com.conf,
# symlink en sites-enabled/, `nginx -t` y `systemctl reload nginx`.

# --- web (motoshertz.com, www) -> :3000 -------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name motoshertz.com www.motoshertz.com;

    ssl_certificate /etc/ssl/cloudflare/motoshertz.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/motoshertz.com.key;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name motoshertz.com www.motoshertz.com;
    return 301 https://$host$request_uri;
}

# --- cms-admin (admin.motoshertz.com) -> :3001 ------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.motoshertz.com;

    ssl_certificate /etc/ssl/cloudflare/motoshertz.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/motoshertz.com.key;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.motoshertz.com;
    return 301 https://$host$request_uri;
}

# --- backend GraphQL + medios (api.motoshertz.com) -> :8080 -----------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.motoshertz.com;

    ssl_certificate /etc/ssl/cloudflare/motoshertz.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/motoshertz.com.key;

    # MEDIA_MAX_UPLOAD_MB=15 en el backend — con margen.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.motoshertz.com;
    return 301 https://$host$request_uri;
}
